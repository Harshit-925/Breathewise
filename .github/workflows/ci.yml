name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Security & Build
    runs-on: ubuntu-latest
    env:
      USE_MOCKS: 'true'
      ALLOWED_ORIGINS: 'http://localhost:5173,http://localhost:3000'
      PORT: 3001
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Automated Test Suites
        run: npm test

      - name: Build Server Gateway
        run: npm run build:server

      - name: Build Production Client
        run: npm run build

      - name: Verify Metadata Generation
        run: npx tsx scripts/generate-metadata.ts
